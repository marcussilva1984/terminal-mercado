name: B3 flow scrape

on:
  schedule:
    # 10:00 UTC — mesma janela do cron da Vercel, mas com horário garantido
    # (Vercel Hobby não garante horário exato, pode atrasar até 1h).
    - cron: "0 10 * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call b3-flow-scrape endpoint
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://terminal-mercado.vercel.app/api/cron/b3-flow-scrape"
