name: Fatos Relevantes B3 alert to Telegram

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call fatos-relevantes endpoint
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://terminal-mercado.vercel.app/api/cron/fatos-relevantes"
